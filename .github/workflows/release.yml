# Automatically build the project and run any configured tests for every push
# and submitted pull request. This can help catch issues that only occur on
# certain platforms or Java versions, and provides a first line of defence
# against bad commits.

# Adopted from https://github.com/ModFest/glowcase/blob/1.21/.github/workflows/release.yml

name: Release Build

on:
  release:
    types:
      - published

permissions:
  id-token: write
  attestations: write
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: 17
      - name: Validate gradle wrapper
        uses: gradle/actions/wrapper-validation@v4
      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew
      - name: Build with Gradle
        run: |
          ./gradlew build
          ./gradlew createAllExecutables
      - name: Generate artifact attestation
        uses: actions/attest-build-provenance@v3
        with:
          subject-path: 'build/libs/PW-GUI-*.jar, build/launch4j/PW-GUI-*.exe'
      - name: Upload GitHub release
        uses: AButler/upload-release-assets@v3.0
        with:
          files: 'build/libs/PW-GUI-*.jar;build/launch4j/PW-GUI-*.exe'
          repo-token: ${{ secrets.GITHUB_TOKEN }}